version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: sql-tuning-postgres
    environment:
      POSTGRES_USER: tuning
      POSTGRES_PASSWORD: tuning1234
      POSTGRES_DB: tuning
    ports:
      - "5432:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuning"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
