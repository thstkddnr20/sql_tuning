version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sql-tuning-mysql
    environment:
      MYSQL_ROOT_PASSWORD: tuning1234
      MYSQL_DATABASE: tuning
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=256M
      --innodb_flush_log_at_trx_commit=2
      --sync_binlog=0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptuning1234"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
